name: publish

# Publica en PyPI al publicar un release (o a mano desde Actions).
#
# Antes del primer envío, da de alta el "Trusted Publisher" en
# https://pypi.org/manage/account/publishing/ ("Add a new pending publisher"):
#   PyPI Project Name: interui      (minúsculas, como en pyproject.toml)
#   Owner:             jurdin32
#   Repository name:   interUI
#   Workflow name:     publish.yml  (solo el nombre del archivo)
#   Environment name:  pypi         (el mismo de este workflow)
#
# Para ensayar antes, repite el alta en
# https://test.pypi.org/manage/account/publishing/ con environment `testpypi`.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      test_pypi:
        description: "Publicar primero en TestPyPI"
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Construir y validar
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  testpypi:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.test_pypi
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    needs: build
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && !inputs.test_pypi)
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
