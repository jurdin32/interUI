[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "interui"
dynamic = ["version"]
description = "Framework para aplicaciones de escritorio en Python con HTML, Tailwind CSS y JavaScript."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Johnny Urdin", email = "urdin32@live.com" }]
keywords = [
  "gui", "desktop", "html", "tailwindcss", "webview", "ui", "pywebview",
  "cross-platform", "tailwind",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: MacOS X",
  "Environment :: Win32 (MS Windows)",
  "Environment :: X11 Applications",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Desktop Environment",
  "Topic :: Software Development :: User Interfaces",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
# Ventana nativa (WebKit / WebView2 / WebKitGTK).
desktop = ["pywebview>=4.4"]
# Alias histórico usado en la documentación.
gui = ["pywebview>=4.4"]
# Motores de base de datos (SQLite y archivos JSON no necesitan extras).
postgres = ["psycopg[binary]>=3.1"]
mysql = ["pymysql>=1.1"]
mongo = ["pymongo>=4.6"]
# Desarrollo y publicación.
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "build>=1.2",
  "twine>=5.0",
]

[project.scripts]
interui = "interui.cli:main"

[project.urls]
Homepage = "https://github.com/jurdin32/interUI"
Repository = "https://github.com/jurdin32/interUI"
Issues = "https://github.com/jurdin32/interUI/issues"
Changelog = "https://github.com/jurdin32/interUI/commits/main"
Documentation = "https://github.com/jurdin32/interUI#readme"

[tool.hatch.version]
path = "interui/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["interui"]

[tool.hatch.build.targets.sdist]
include = [
  "/interui",
  "/tests",
  "/examples",
  "/frontend",
  "/docs",
  "/README.md",
  "/LICENSE",
  "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E9", "F"]
ignore = ["F401"]
